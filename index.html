    <!-- PWA -->
    <!-- ה-HTML המוכן ב-#root הוא של דף הבית: בנתיב אחר מסתירים אותו עד ש-React מצייר (main.jsx) -->
    <script>
      (function () {
        var h = document.documentElement;
        var path = location.pathname.replace(/\/+$/, '') || '/';
        if (path !== (h.dataset.prerendered || '/')) h.dataset.route = 'other';
      })();
    </script>
    <!-- הגדרות תפריט הנגישות — מוחלות לפני הציור הראשון (אותה לוגיקה כמו src/lib/a11yPrefs.js) -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('easylex-a11y') || 'null');
        if (p) {
          var h = document.documentElement;
          var steps = ['', '112.5%', '125%', '140%'];
          if (steps[p.textStep]) h.style.fontSize = steps[p.textStep];
          if (p.contrast) h.classList.add('a11y-contrast');
          if (p.links) h.classList.add('a11y-links');
          if (p.readable) h.classList.add('a11y-readable');
          if (p.stopMotion) h.classList.add('a11y-stop-motion');
        }
      } catch (e) {}
    </script>
    <style>html[data-route='other'] #main { visibility: hidden; }</style>
    <link rel="manifest" href="/manifest.json" />
    <!-- theme-color = רקע הכותרת (mist), כדי שסרגל הדפדפן בטלפון יתמזג איתה -->
    <meta name="theme-color" content="#E1F3EF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- הגופן מאוחסן אצלנו (src/index.css) — טעינה מוקדמת של העברית, ותמונת הפתיחה של הקליפ בראש העמוד -->
    <link rel="preload" href="/fonts/assistant-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <!-- גם הלטינית: "Easylex" / "The Easy Way" בכותרות — בלי זה הכותרת משנה גובה כשהגופן מתחלף (CLS) -->
    <link rel="preload" href="/fonts/assistant-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/media/hero-bg-v2-poster.webp" as="image" type="image/webp" fetchpriority="high" />
    <link rel="preload" href="/media/practice-v1-poster.webp" as="image" type="image/webp" />
